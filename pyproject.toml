[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packet-tracer-mcp"
version = "0.8.0"
description = "MCP server for Cisco Packet Tracer - topology planning, validation, auto-fix, generation, and configuration"
requires-python = ">=3.11"
dependencies = [
    # mcp >=1.13 builds tool output schemas from return annotations, which requires
    # pydantic >=2.11. Pinning pydantic too low (e.g. 2.8) makes the server crash on
    # startup at the first @mcp.tool() with a PydanticUserError. Keep both in sync.
    "mcp[cli]>=1.13,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
quality = ["ruff==0.16.7"]
# Single source for the documentation build; .github/workflows/docs.yml installs
# this extra instead of a separate requirements file that would drift from here.
docs = ["mkdocs-material>=9.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports the one canonical namespace, `packet_tracer_mcp`, which
# resolves through this checkout's editable install; `tests/conftest.py` refuses
# to collect if it resolved anywhere else. The repository root is on the path for
# the suite's own packages -- `tests.*` helpers and `scripts.*` under test -- not
# for the product. Some tests also read repository-relative files, so run the
# suite from the repository root.
pythonpath = ["."]
# Import mode is a measured decision, not a default left to drift. Measured on
# pytest 9.1.1 at the canonical namespace migration:
#   prepend   (chosen)   5059 tests collected, 0 collection errors
#   importlib (rejected) 4762 tests collected, 18 collection errors
# Nineteen test modules import a sibling by bare module name, which only
# resolves because prepend puts the test's own directory first on sys.path.
# importlib does not, so those modules fail to collect. Pinned so a future
# change of the pytest default is a deliberate, re-measured decision.
addopts = ["--import-mode=prepend"]

[project.scripts]
pt-mcp = "packet_tracer_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/packet_tracer_mcp"]

[tool.ruff]
required-version = "==0.16.7"
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "D", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
