name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    env:
      # Keep bridge tests away from the runner user's real token file.
      PT_MCP_BRIDGE_TOKEN: ci-token-long-enough-to-be-considered-valid-0123456789
    strategy:
      fail-fast: false
      matrix:
        # Windows is primary; Ubuntu detects platform and path assumptions.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]

    steps:
      # Full history lets provenance tests resolve their characterized commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # setup-python bootstraps the environment; governed commands run in the
      # virtual environment owned by this checkout.
      - name: Create checkout-local environment
        run: python -m venv .venv

      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[test,quality]"

      - name: Install (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[test,quality]"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Run tests (Ubuntu)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create checkout-local environment
        run: python -m venv .venv

      - name: Install quality tools
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[quality]"

      - name: Resolve comparison base
        id: comparison
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          default_base="origin/$DEFAULT_BRANCH"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            comparison="$PR_BASE_SHA"
          elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] \
            && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            comparison="$PUSH_BEFORE_SHA"
          else
            comparison="$default_base"
          fi
          echo "ref=$comparison" >> "$GITHUB_OUTPUT"

      # The committed record authorizes CANONICAL_PYTHON_NAMESPACE only while the
      # comparison merge base is its exact base commit; against any other base it
      # is printed as INACTIVE and grants no exemption. See the mechanical
      # migration quality boundary brief.
      - name: Run Ruff lint and format gate
        run: |
          .venv/bin/python scripts/quality_gate.py \
            --base "${{ steps.comparison.outputs.ref }}" \
            --delivery-commit "$GITHUB_SHA" \
            --mechanical-authorization scripts/mechanical_authorizations/canonical-python-namespace.json

      - name: Check whitespace
        run: git diff --check "${{ steps.comparison.outputs.ref }}...HEAD"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create checkout-local environment
        run: python -m venv .venv

      - name: Install documentation tools
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[docs]"

      - name: Build documentation
        run: .venv/bin/python -m mkdocs build --site-dir _site
