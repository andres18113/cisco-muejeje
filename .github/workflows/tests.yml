name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    env:
      # Token fijo para que los tests del bridge no toquen el archivo real
      # del usuario que corre el runner.
      PT_MCP_BRIDGE_TOKEN: ci-token-long-enough-to-be-considered-valid-0123456789
    strategy:
      fail-fast: false
      matrix:
        # Windows es la plataforma principal (Packet Tracer, portapapeles vía
        # clip.exe). Ubuntu corre igual para detectar suposiciones de rutas.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]

    steps:
      # Historia completa a proposito: el oraculo CP-LIVE M0 comprueba la
      # procedencia de su expected contra el objeto commit que caracterizo
      # (`git show -s --format=%T <sha>` en
      # tests/test_cp_live_m0_equivalence_baseline.py). El checkout superficial
      # por defecto no trae ese commit, la comprobacion no puede hacerse y el
      # test falla en vez de saltarse. Es una lectura local: no hay red dentro
      # de pytest.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # El preflight de import y el entorno de desarrollo comparten contrato:
      # el proceso gobernado pertenece a la .venv del checkout. setup-python
      # es solo el bootstrap con el que se crea ese entorno local.
      - name: Create checkout-local environment
        run: python -m venv .venv

      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[test]"

      - name: Install (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[test]"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Run tests (Ubuntu)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pytest -q
